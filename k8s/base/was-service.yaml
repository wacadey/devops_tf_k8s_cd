apiVersion: v1
kind: Service
metadata:
  name: was
  labels:
    app.kubernetes.io/name: was
    app.kubernetes.io/part-of: de-ai-12
    # Prometheus ServiceMonitor가 실제 운영 WAS Service만 선택하도록 사용하는 라벨 
    monitoring: enabled
    
spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: was

  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP